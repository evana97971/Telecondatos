<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Lista de Tareas</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container py-5">
    <!-- Header -->
    <header class="text-center mb-5">
      <h1 class="display-4">
        <i class="bi bi-check2-square"></i> Mi Lista de Tareas
      </h1>
      <p class="text-muted">Organiza tus actividades diarias</p>
    </header>

    <div class="row">
      <!-- Formulario -->
      <div class="col-lg-4 mb-4">
        <div class="card shadow-sm">
          <div class="card-body">
            <h5 class="card-title mb-3">
              <i class="bi bi-plus-circle"></i> Nueva Tarea
            </h5>
            <form id="taskForm">
              <div class="mb-3">
                <label for="taskInput" class="form-label">Descripción</label>
                <input 
                  type="text" 
                  id="taskInput" 
                  class="form-control" 
                  placeholder="Escribe una tarea..."
                  required
                >
              </div>
              
              <div class="mb-3">
                <label for="prioritySelect" class="form-label">Prioridad</label>
                <select id="prioritySelect" class="form-select">
                  <option value="baja">Baja</option>
                  <option value="media" selected>Media</option>
                  <option value="alta">Alta</option>
                </select>
              </div>

              <div class="mb-3">
                <label for="categorySelect" class="form-label">Categoría</label>
                <select id="categorySelect" class="form-select">
                  <option value="trabajo">Trabajo</option>
                  <option value="personal" selected>Personal</option>
                  <option value="salud">Salud</option>
                  <option value="compras">Compras</option>
                  <option value="otro">Otro</option>
                </select>
              </div>

              <div class="mb-3">
                <label for="dueDateInput" class="form-label">Fecha de vencimiento</label>
                <input 
                  type="date" 
                  id="dueDateInput" 
                  class="form-control"
                >
              </div>

              <button type="submit" class="btn btn-primary w-100">
                <i class="bi bi-plus"></i> Agregar Tarea
              </button>
            </form>
          </div>
        </div>

        <!-- Estadísticas -->
        <div class="card shadow-sm mt-3">
          <div class="card-body">
            <h5 class="card-title mb-3">
              <i class="bi bi-graph-up"></i> Estadísticas
            </h5>
            <div id="stats" class="stats-container">
              <div class="stat-item">
                <span>Total</span>
                <strong id="totalTasks">0</strong>
              </div>
              <div class="stat-item">
                <span>Completadas</span>
                <strong id="completedTasks">0</strong>
              </div>
              <div class="stat-item">
                <span>Pendientes</span>
                <strong id="pendingTasks">0</strong>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Lista de Tareas -->
      <div class="col-lg-8">
        <!-- Filtros -->
        <div class="card shadow-sm mb-4">
          <div class="card-body">
            <div class="row g-2">
              <div class="col-md-4">
                <input 
                  type="text" 
                  id="searchInput" 
                  class="form-control" 
                  placeholder="Buscar tareas..."
                >
              </div>
              <div class="col-md-4">
                <select id="filterSelect" class="form-select">
                  <option value="todas">Todas</option>
                  <option value="pendientes">Pendientes</option>
                  <option value="completadas">Completadas</option>
                </select>
              </div>
              <div class="col-md-4">
                <select id="sortSelect" class="form-select">
                  <option value="fecha-asc">Más próxima primero</option>
                  <option value="fecha-desc">Más lejana primero</option>
                  <option value="prioridad">Mayor prioridad</option>
                  <option value="creacion">Más reciente</option>
                </select>
              </div>
            </div>
          </div>
        </div>

        <!-- Lista -->
        <div id="tasksList" class="tasks-container">
          <div class="alert alert-info text-center">
            <i class="bi bi-inbox"></i> No hay tareas aún. ¡Crea una nueva!
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal de edición -->
  <div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">
            <i class="bi bi-pencil-square"></i> Editar Tarea
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="editForm">
            <div class="mb-3">
              <label for="editTaskInput" class="form-label">Descripción</label>
              <input type="text" id="editTaskInput" class="form-control" required>
            </div>
            <div class="mb-3">
              <label for="editPriority" class="form-label">Prioridad</label>
              <select id="editPriority" class="form-select">
                <option value="baja">Baja</option>
                <option value="media">Media</option>
                <option value="alta">Alta</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="editCategory" class="form-label">Categoría</label>
              <select id="editCategory" class="form-select">
                <option value="trabajo">Trabajo</option>
                <option value="personal">Personal</option>
                <option value="salud">Salud</option>
                <option value="compras">Compras</option>
                <option value="otro">Otro</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="editDueDate" class="form-label">Fecha de vencimiento</label>
              <input type="date" id="editDueDate" class="form-control">
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-primary" id="saveEditBtn">Guardar cambios</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
